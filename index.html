<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="tabBar" class="tab-bar"></section>

      <header class="toolbar">
        <button id="newTabBtn" title="New tab">＋</button>
        <button id="backBtn" title="Go back">←</button>
        <button id="forwardBtn" title="Go forward">→</button>
        <button id="reloadBtn" title="Reload">⟳</button>
        <input
          id="urlInput"
          type="text"
          value="duck://newtab"
          aria-label="URL"
          placeholder="Type a URL"
        />
        <button id="goBtn">Go</button>
        <div class="menu-wrap">
          <button id="extensionsMenuBtn" title="Extensions menu">Extensions ▾</button>
          <div id="extensionsMenu" class="extensions-menu" hidden></div>
        </div>
      </header>

      <section class="viewer-wrap">
        <div id="status" class="status">Ready.</div>
        <div id="internalPage" class="internal-page" hidden></div>
        <div id="webViews" class="web-views"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
